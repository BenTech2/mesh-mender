# Mesh Mender is a static app: no backend, no build step, no state.
# nginx only has to serve the files with the right types and headers.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The app is built from ES modules, so a stale cached module sitting next to
    # a fresh index.html is not a slightly out-of-date page — it is a broken
    # one. "no-cache" still lets the browser store the file; it just has to ask
    # first, and the answer is almost always a cheap 304.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # No client-side routing here, so a missing file is a genuine 404. Serving
    # index.html in its place would hand the browser HTML where it asked for
    # JavaScript, and the real error would be buried under a MIME-type one.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nothing here is secret, but there is no reason to serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
